<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antes e depois com arrastar — componentes prémio Bora</title>
<!--
  ===========================================================================
  08 — ANTES / DEPOIS COM ARRASTAR
  ---------------------------------------------------------------------------
  PARA QUE SERVE
  Duas imagens sobrepostas com um puxador que a pessoa arrasta. Serve clínicas
  (tratamento), oficinas (reparação), estética (corte, unhas), limpeza.

  E SERVE PARA VENDER SITES
  Site velho à esquerda, site novo à direita. É o argumento mais forte que
  existe numa proposta — e é a base do vídeo curto do canal (ver marketing/).

  COMO FUNCIONA
  Uma <div> com clip-path por cima da outra, comandada por uma variável CSS
  --corte. Pointer Events cobrem rato, dedo e caneta com o mesmo código.
  Nada de bibliotecas.

  ACESSIBILIDADE — a parte que quase todos os componentes destes falham
  O puxador é um <input type="range"> a sério, escondido visualmente mas
  funcional: setas do teclado movem, Home/End vão às pontas, e o leitor de
  ecrã anuncia "50 por cento". Sem isto o componente é inacessível.
  As duas imagens têm alt próprio, por isso quem não vê fica na mesma a saber
  o que está antes e o que está depois.

  ESTADO POR OMISSÃO
  Sem JavaScript o corte fica a 50% (é CSS) e as duas metades vêem-se. Não há
  informação escondida.
  ===========================================================================
-->
<style>
  :root{--tinta:#0B0F0D;--tinta-2:#121815;--texto:#F4F7F5;--texto-2:#A9B5AE;
        --verde:#16A34A;--laranja:#F97316;--linha:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--tinta);color:var(--texto);
       font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
  img{max-width:100%;display:block}
  :focus-visible{outline:3px solid var(--laranja);outline-offset:4px;border-radius:8px}
  .topo{text-align:center;padding:9vh 20px 5vh}
  .topo h1{font-size:clamp(1.7rem,5vw,2.6rem);font-weight:900;letter-spacing:-.03em}
  .topo p{color:var(--texto-2);margin-top:12px}
  .caixa{max-width:900px;margin:0 auto;padding:0 20px 12vh}

  .ad{
    --corte:50%;
    position:relative;border-radius:18px;overflow:hidden;
    border:1px solid var(--linha);background:var(--tinta-2);
    aspect-ratio:16/10;touch-action:pan-y;         /* deixa a página rolar */
    user-select:none;-webkit-user-select:none;
  }
  .ad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* a imagem "depois" é cortada pela variável */
  .ad .depois{clip-path:inset(0 0 0 var(--corte))}

  .rot{
    position:absolute;top:14px;z-index:3;
    background:rgba(11,15,13,.86);border:1px solid var(--linha);
    border-radius:999px;padding:6px 14px;
    font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  }
  .rot.a{left:14px;color:var(--texto-2)}
  .rot.d{right:14px;color:var(--verde)}

  .linha{
    position:absolute;top:0;bottom:0;left:var(--corte);z-index:4;
    width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);
    pointer-events:none;
  }
  .pega{
    position:absolute;top:50%;left:var(--corte);z-index:5;
    width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:999px;
    background:#fff;color:#0B0F0D;display:grid;place-items:center;
    font-weight:900;font-size:1.1rem;box-shadow:0 8px 24px -8px rgba(0,0,0,.9);
    pointer-events:none;
  }

  /* o comando verdadeiro: um range a sério, invisível mas por cima de tudo */
  .ad input[type=range]{
    position:absolute;inset:0;z-index:6;width:100%;height:100%;
    margin:0;opacity:0;cursor:ew-resize;
    -webkit-appearance:none;appearance:none;background:transparent;
  }
  .ad input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:56px;height:100%;cursor:ew-resize;
  }
  .ad input[type=range]::-moz-range-thumb{
    width:56px;height:100%;border:0;background:transparent;cursor:ew-resize;
  }
  /* o foco do teclado tem de aparecer, e o range é invisível → marca a moldura */
  .ad:focus-within{outline:3px solid var(--laranja);outline-offset:4px}

  .dica{text-align:center;color:var(--texto-2);font-size:.9rem;margin-top:16px}
</style>
</head>
<body>

<div class="topo">
  <h1>Antes e depois</h1>
  <p>Arrasta. Ou clica e usa as setas do teclado.</p>
</div>

<div class="caixa">
  <div class="ad" id="ad">
    <span class="rot a">Antes</span>
    <span class="rot d">Depois</span>

    <img class="antes" width="1600" height="1000" alt="Site antigo: texto centrado, sem hierarquia, sem imagens"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1000'%3E%3Crect width='1600' height='1000' fill='%23dedad2'/%3E%3Crect x='560' y='190' width='480' height='34' fill='%23a49c8e'/%3E%3Crect x='620' y='260' width='360' height='18' fill='%23bdb6a8'/%3E%3Crect x='620' y='300' width='360' height='18' fill='%23bdb6a8'/%3E%3Crect x='700' y='400' width='200' height='46' fill='%238d8578'/%3E%3Ctext x='800' y='800' font-family='sans-serif' font-size='46' fill='%238d8578' text-anchor='middle'%3Esite antigo%3C/text%3E%3C/svg%3E">

    <img class="depois" width="1600" height="1000" alt="Site novo: herói com imagem, hierarquia clara e botão de acção"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1000'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23123a24'/%3E%3Cstop offset='1' stop-color='%230B0F0D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1600' height='1000' fill='url(%23g)'/%3E%3Crect x='120' y='170' width='700' height='64' rx='8' fill='%23F4F7F5'/%3E%3Crect x='120' y='260' width='520' height='64' rx='8' fill='%2316A34A'/%3E%3Crect x='120' y='380' width='400' height='24' rx='6' fill='%23A9B5AE'/%3E%3Crect x='120' y='470' width='250' height='62' rx='31' fill='%23F97316'/%3E%3Crect x='950' y='150' width='520' height='700' rx='26' fill='%231a2a22'/%3E%3Ctext x='800' y='930' font-family='sans-serif' font-size='46' fill='%23A9B5AE' text-anchor='middle'%3Esite novo%3C/text%3E%3C/svg%3E">

    <div class="linha" aria-hidden="true"></div>
    <div class="pega" aria-hidden="true">⇄</div>

    <input type="range" id="corte" min="0" max="100" value="50" step="1"
           aria-label="Quanto do depois se vê, em percentagem">
  </div>
  <p class="dica">Teclado: setas movem, Home e End vão às pontas.</p>
</div>

<script>
(function(){
  var ad   = document.getElementById('ad');
  var pega = document.getElementById('corte');
  if(!ad || !pega) return;

  function aplicar(v){ ad.style.setProperty('--corte', v + '%'); }
  aplicar(pega.value);

  // Um único ouvinte: o range trata de rato, dedo, caneta e teclado.
  pega.addEventListener('input', function(){ aplicar(pega.value); });

  // Clicar em qualquer sítio da imagem leva o corte para lá (não só arrastar).
  ad.addEventListener('pointerdown', function(ev){
    if(ev.target === pega) return;                  // o range já trata
    var r = ad.getBoundingClientRect();
    var v = Math.round(((ev.clientX - r.left) / r.width) * 100);
    pega.value = Math.min(Math.max(v,0),100);
    aplicar(pega.value);
    pega.focus();
  });
})();
</script>
</body>
</html>
